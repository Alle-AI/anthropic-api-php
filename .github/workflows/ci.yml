name: CI

on:
  push:
    branches: [main, '1.x']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Run Pint
        run: composer lint

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Run PHPStan
        run: composer stan

  tests:
    name: Tests (PHP ${{ matrix.php }} / ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: ['highest', 'lowest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-progress --no-interaction --prefer-dist
          else
            composer update --no-progress --no-interaction --prefer-dist
          fi
      - name: Run PHPUnit
        run: composer test:unit && composer test:contract

  examples:
    name: Examples parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Lint examples
        run: |
          for f in examples/*.php; do
            php -l "$f"
          done
